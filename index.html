<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VulnMonitor</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:#111217; color:#d8d9e0;
         font:16px/1.5 system-ui, sans-serif; text-align:center; padding:24px; }
  .box { max-width:420px; }
  a { color:#6ea8fe; }
  .quiet { color:#8b8d98; font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<div class="box">
  <p id="msg">Открываю дашборд...</p>
  <p class="quiet" id="hint"></p>
</div>
<script>
// Адрес туннеля меняется несколько раз в час, поэтому он не вшит в страницу,
// а лежит рядом в url.txt: сторож на сервере переписывает его при каждой смене.
// Файл читается через api.github.com, а не через raw и не через Pages: те
// держат ответ в кеше пять и десять минут, и всё это время страница вела бы
// на уже мёртвый адрес. У api кеш минута.
var SRC = 'https://api.github.com/repos/GLShers/vulnmonitor-link/contents/url.txt';
var PATH = '/d/vulnmonitor-main/vulnmonitor';

fetch(SRC + '?t=' + Date.now(), {
  cache: 'no-store',
  headers: { 'Accept': 'application/vnd.github.raw' }
})
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (t) {
    var url = t.trim();
    if (!/^https:\/\//.test(url)) throw new Error('пустой адрес');
    document.getElementById('msg').innerHTML =
      'Открываю дашборд: <a href="' + url + PATH + '">' + url + '</a>';
    location.replace(url + PATH);
  })
  .catch(function () {
    document.getElementById('msg').textContent = 'Дашборд сейчас недоступен.';
    document.getElementById('hint').textContent =
      'Сервер поднимает связь заново, обычно это занимает пару минут. Обновите страницу.';
  });
</script>
</body>
</html>
